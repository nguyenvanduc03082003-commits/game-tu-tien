<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Thượng Đế Tu Tiên Simulator (Pixel 2D)</title>
    <link rel="preload" href="/fonts/NotoSans.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Noto Sans Dialogue';
        src: url('/fonts/NotoSans.ttf') format('truetype');
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d1117;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #e6edf3;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: grab;
      }
      #game-canvas:active {
        cursor: grabbing;
      }
      /* UI Overlay Layer */
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .interactive-ui {
        pointer-events: auto;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(13, 17, 23, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #484f58;
      }

      /* Responsive HUD Layout Containers */
      .hud-top-right {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: row-reverse;
        align-items: flex-start;
        gap: 10px;
        z-index: 100;
        pointer-events: none;
      }
      .hud-top-right > * {
        pointer-events: auto;
      }

      .hud-panel {
        background: rgba(13, 17, 23, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        color: #c9d1d9;
      }

      /* Breakpoint: Medium Screen (<= 1024px) */
      @media (max-width: 1024px) {
        .hud-top-right {
          top: 8px;
          right: 8px;
          gap: 6px;
        }
      }

      /* Breakpoint: Narrow / Small Screen (<= 860px) */
      @media (max-width: 860px) {
        .hud-top-right {
          flex-direction: column;
          align-items: flex-end;
          gap: 6px;
        }
      }

      /* Breakpoint: Mobile / Tiny Screen (<= 768px) */
      @media (max-width: 768px) {
        .hud-top-right {
          top: 6px;
          right: 6px;
        }
      }

      /* Height constraint: Low viewport (<= 700px) */
      @media (max-height: 700px) {
        .hud-top-right {
          top: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="ui-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
